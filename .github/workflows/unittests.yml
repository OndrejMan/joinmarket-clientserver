name: Python package

on: [push, workflow_dispatch]

jobs:
  build:
    name: python ${{ matrix.python-version }}, bitcoind ${{ matrix.bitcoind-version }} on self-hosted
    runs-on: [self-hosted, x64]
    container:
      image: python:3.13-bookworm
      options: --shm-size=2g
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
        bitcoind-version: ["29.2"]

    steps:
      - name: Prepare container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git gnupg shellcheck sudo wget
      - uses: actions/checkout@v3
      - name: Run ShellCheck
        run: git -c safe.directory="$PWD" ls-files -z '*.sh' | xargs -0 -r shellcheck --format=gcc
#      - name: Cache venv
#        id: cache-venv
#        uses: actions/cache@v3
#        env:
#          cache-name: venv
#        with:
#          path: jmvenv
#          key: ${{ runner.os }}-${{ matrix.python-version }}-${{ env.cache-name }}-${{ hashFiles('requirements/*.txt', 'install.sh', '*/setup.py') }}
      - name: Setup joinmarket + virtualenv
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          bash -x ./install.sh --develop --without-qt
          ./jmvenv/bin/python -m pip install --upgrade pip
      - name: Lint with flake8
        run: source ./jmvenv/bin/activate && ./test/lint/lint-python.sh
      - name: Cache bitcoind
        uses: actions/cache@v3
        env:
          cache-name: bitcoind
          BITCOIND_VERSION: ${{ matrix.bitcoind-version }}
        with:
          path: ~/bitcoin/*/bin/bitcoin*
          key: ${{ runner.os }}-${{ env.cache-name }}-${{ env.BITCOIND_VERSION }}-${{ hashFiles('test/testrunner/install_bitcoind.sh') }}
      - name: Install bitcoind
        env:
          BITCOIND_VERSION: ${{ matrix.bitcoind-version }}
        run: bash -x ./test/testrunner/install_bitcoind.sh
      - name: Cache miniircd
        uses: actions/cache@v3
        env:
          cache-name: miniircd
        with:
          path: miniircd/miniircd
          key: ${{ runner.os }}-${{ env.cache-name }}-${{ hashFiles('test/run_tests.sh') }}
      - name: Run tests
        run: source ./jmvenv/bin/activate && bash -x ./test/run_tests.sh
